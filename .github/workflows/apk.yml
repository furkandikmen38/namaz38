      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android 35 platformu
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: APK dosyasini derle
        working-directory: NamazModu_Android
        run: gradle --no-daemon assembleDebug

      - name: APK yi indirilebilir dosya olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Modu-v2-APK
          path: NamazModu_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
